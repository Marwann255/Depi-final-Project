name: pharoh_lense
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.12.1
  animated_bottom_navigation_bar: ^1.4.1
  google_mlkit_object_detection: ^1.0.3
  path_provider: ^2.1.5
  path: ^1.9.1
  tflite_flutter: ^0.12.1
  image: ^4.13.1
  image_picker: ^1.2.4
  http: ^1.6.0
  firebase_core: ^5.2.0
  firebase_ai: ^5.2.0
  flutter_bloc: ^9.1.2
  iconsax_plus: ^1.0.0
  firebase_app_check: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/
    - assets/lookup.json
    - assets/model/embedder.tflite
    - assets/model/embeddings.bin
    - assets/model/gallery_ids.json
